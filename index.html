<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Local Studio</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Fraunces", "Georgia", "serif"],
              sans: ["Outfit", "sans-serif"],
            },
            colors: {
              ink: "#141816",
              mute: "#5c6560",
              paper: "#eef0ee",
              chalk: "#f7f8f6",
              line: "#d2d6d3",
              forest: {
                DEFAULT: "#2a453c",
                deep: "#1c312a",
              },
              brass: "#8a734f",
              rose: "#9a4f45",
            },
            maxWidth: {
              stage: "72rem",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="font-sans text-ink bg-paper antialiased">
    <div class="page-shell min-h-dvh flex flex-col">
      <header class="site-header shrink-0">
        <div
          class="mx-auto w-full max-w-stage px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex items-center justify-between gap-4"
        >
          <a href="index.html" class="flex items-center gap-2.5 sm:gap-3 min-w-0">
            <img src="icons/logo.svg" alt="" class="w-8 h-8 sm:w-9 sm:h-9 shrink-0" />
            <span class="font-display font-semibold text-lg sm:text-xl tracking-tight truncate">
              The Local Studio
            </span>
          </a>
          <nav class="flex items-center gap-1 sm:gap-2 shrink-0">
            <a
              href="project.html"
              class="px-3 py-2 text-sm font-medium text-mute hover:text-ink transition-colors"
            >
              About
            </a>
          </nav>
        </div>
      </header>

      <main class="flex-1 mx-auto w-full max-w-stage px-4 sm:px-6 lg:px-8 pb-10 sm:pb-14">
        <section class="hero pt-6 sm:pt-10 lg:pt-12 pb-8 sm:pb-10 text-center">
          <p class="eyebrow text-brass font-medium tracking-[0.18em] uppercase text-[0.7rem] sm:text-xs mb-3 sm:mb-4">
            Local image atelier
          </p>
          <h1
            class="font-display font-semibold text-balance text-[clamp(1.85rem,5.5vw,3.25rem)] leading-[1.12] tracking-tight"
          >
            Soften any shot
            <span class="text-forest">with quiet precision</span>
          </h1>
          <p class="mt-3 sm:mt-4 text-mute text-[0.95rem] sm:text-lg max-w-md mx-auto text-pretty leading-relaxed">
            Upload a photograph. The server applies a gentle blur and returns it for preview.
          </p>
        </section>

        <!-- Workspace -->
        <section aria-label="Image workspace" class="workspace">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 sm:gap-6 lg:gap-8">
            <!-- Original -->
            <div class="stage-col flex flex-col gap-3">
              <div class="flex items-baseline justify-between gap-3 px-0.5">
                <h2 class="font-display text-sm sm:text-base font-semibold text-ink">
                  Original
                </h2>
                <p id="file-meta" class="text-xs text-mute truncate max-w-[55%] sm:max-w-[60%] text-right hidden"></p>
              </div>

              <label
                id="drop-zone"
                for="image-input"
                class="drop-zone stage group relative flex flex-col items-center justify-center cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-forest/40 focus-visible:ring-offset-2 focus-visible:ring-offset-paper"
              >
                <input
                  id="image-input"
                  type="file"
                  accept="image/*"
                  class="sr-only"
                />
                <img
                  id="preview-original"
                  alt="Original preview"
                  class="preview-img hidden"
                />
                <div
                  id="upload-prompt"
                  class="flex flex-col items-center gap-3 sm:gap-4 px-5 sm:px-8 text-center pointer-events-none"
                >
                  <span class="upload-icon-wrap" aria-hidden="true">
                    <img src="icons/upload.svg" alt="" class="w-7 h-7 sm:w-8 sm:h-8" />
                  </span>
                  <div>
                    <p class="font-medium text-ink text-sm sm:text-base">
                      Drop an image, or browse
                    </p>
                    <p class="mt-1 text-xs sm:text-sm text-mute">
                      PNG, JPG, WEBP, GIF
                    </p>
                  </div>
                </div>
              </label>
              <p id="file-error" class="hidden text-sm text-rose font-medium px-0.5" role="alert"></p>
            </div>

            <!-- Result -->
            <div class="stage-col flex flex-col gap-3">
              <div class="flex items-baseline justify-between gap-3 px-0.5">
                <h2 class="font-display text-sm sm:text-base font-semibold text-ink">
                  Result
                </h2>
                <span class="text-xs text-mute tracking-wide">Blurred</span>
              </div>

              <div id="result-panel" class="stage relative overflow-hidden">
                <p
                  id="result-placeholder"
                  class="absolute inset-0 flex items-center justify-center text-mute text-sm px-6 text-center"
                >
                  Your result will appear here
                </p>
                <img
                  id="preview-blurred"
                  alt="Blurred result"
                  class="preview-img hidden"
                />
                <div
                  id="loading"
                  class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 bg-chalk/85 backdrop-blur-[2px]"
                >
                  <div class="spinner" aria-hidden="true"></div>
                  <span class="text-sm font-medium text-forest-deep">Softening…</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Shared actions: sticky on small screens so Blur stays reachable -->
          <div
            class="actions actions-bar mt-5 sm:mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-end"
          >
            <p
              id="api-error"
              class="hidden text-sm text-rose font-medium text-center sm:text-left sm:mr-auto"
              role="alert"
            ></p>
            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
              <a
                id="download-btn"
                href="#"
                download="blurred-image.png"
                class="btn btn-ghost hidden w-full sm:w-auto text-center"
              >
                Download
              </a>
              <button
                id="blur-btn"
                type="button"
                disabled
                class="btn btn-primary w-full sm:w-auto sm:min-w-[10.5rem]"
              >
                Blur image
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer mt-auto">
        <div
          class="mx-auto max-w-stage px-4 sm:px-6 lg:px-8 py-5 sm:py-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-mute"
        >
          <span>The Local Studio</span>
          <a href="project.html" class="hover:text-ink transition-colors">Project overview</a>
        </div>
      </footer>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
