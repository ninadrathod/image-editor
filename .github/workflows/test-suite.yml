name: Backend service tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-suite:
    name: Run test-suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r test-suite/requirements.txt

      - name: Run service unit tests
        run: pytest test-suite/ -v
